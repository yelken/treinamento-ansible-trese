# ansible.cfg padrão do nó de controle (usado fora das pastas dos desafios).
# Cada desafio traz o seu próprio ansible.cfg, com as mesmas opções de ambiente abaixo.
#
# Em /lab o Windows monta tudo com permissão 777 e o Ansible IGNORA um ansible.cfg
# em diretório gravável por todos. Por isso a variável ANSIBLE_CONFIG é definida
# explicitamente no contêiner e atualizada pelo prompt ao entrar em cada desafio.

[defaults]
# --- Ambiente do laboratório ---------------------------------------------------
remote_user          = ansible
private_key_file     = ~/.ssh/id_ed25519
# ATENÇÃO: desativar a checagem de chave de host é aceitável APENAS em laboratório,
# onde os nós são recriados a todo momento (e ganham novas chaves). Em produção,
# mantenha a checagem ativada e distribua os known_hosts.
host_key_checking    = False
collections_path     = /usr/share/ansible/collections
interpreter_python   = auto_silent
# --- Conforto de uso -----------------------------------------------------------
retry_files_enabled  = False
callback_result_format = yaml
forks                = 5

[privilege_escalation]
# O desafio decide onde usar become; aqui só definimos o método.
become_method        = sudo

[ssh_connection]
pipelining           = True

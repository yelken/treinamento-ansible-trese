# Cliente SSH do nó de controle: `ssh web1` funciona direto.
# Os nós são recriados pelo `lab reset` e ganham novas chaves de host; por isso
# a checagem é desativada (aceitável apenas em laboratório).
Host web1 web2 db1 lb1
    User ansible
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    LogLevel ERROR

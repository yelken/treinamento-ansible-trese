# ansible.cfg deste desafio. O Ansible lê este arquivo quando você roda os comandos
# dentro desta pasta (o prompt do nó de controle aponta ANSIBLE_CONFIG para ele).

[defaults]
# Onde está o inventário: a PASTA inventario/ (o Ansible lê todos os arquivos dela).
inventory            = inventario

# --- Ambiente do laboratório: não precisa mexer ----------------------------------
remote_user          = ansible
private_key_file     = ~/.ssh/id_ed25519
# ATENÇÃO: desativar a checagem de chave de host é aceitável APENAS em laboratório,
# onde os nós são recriados a todo momento. Em produção, mantenha-a ativada.
host_key_checking    = False
collections_path     = /usr/share/ansible/collections
interpreter_python   = auto_silent
retry_files_enabled  = False
callback_result_format = yaml

[privilege_escalation]
become_method        = sudo
